  /{competition}/standings:
    get:
      summary: League table
      tags:
      - standings
      description: 'The table for a season, with played, won, drawn, lost, goals, goal difference, points and recent form. Ordered by the competition''s own tie-break rules: head-to-head first in Spain, Italy and Portugal, goal difference first in England, France, Germany and the Netherlands.'
      parameters:
      - schema:
          type: string
          pattern: ^\d{4}-\d{2}$
        in: query
        name: season
        required: false
        description: Season label, e.g. 2025-26. Defaults to the current season.
      - schema:
          type: string
        in: path
        name: competition
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        position:
                          type: number
                        team:
                          type: object
                          properties:
                            id:
                              type: number
                            slug:
                              type: string
                              nullable: true
                            name:
                              type: string
                            shortName:
                              type: string
                              nullable: true
                            code:
                              type: string
                              nullable: true
                            crestUrl:
                              type: string
                          required:
                          - id
                          - slug
                          - name
                          - shortName
                          - code
                          - crestUrl
                          additionalProperties: false
                        played:
                          type: number
                        won:
                          type: number
                        drawn:
                          type: number
                        lost:
                          type: number
                        goalsFor:
                          type: number
                        goalsAgainst:
                          type: number
                        goalDiff:
                          type: number
                        points:
                          type: number
                        form:
                          type: string
                        zone:
                          type: string
                          nullable: true
                      required:
                      - position
                      - team
                      - played
                      - won
                      - drawn
                      - lost
                      - goalsFor
                      - goalsAgainst
                      - goalDiff
                      - points
                      - form
                      - zone
                      additionalProperties: false
                  meta:
                    type: object
                    properties:
                      season:
                        type: string
                      page:
                        type: number
                      limit:
                        type: number
                      total:
                        type: number
                    additionalProperties: false
                required:
                - data
                - meta
                additionalProperties: false
