openapi: 3.0.3
info:
  title: Football API
  version: 1.0.0
  description: 'Standings, fixtures, results, live scores, lineups, events, player and team stats for 11 competitions: Premier League, LaLiga, Serie A, Bundesliga, Ligue 1, Eredivisie, Primeira Liga, EFL Championship, UEFA Champions League, UEFA Europa League, UEFA Conference League. Season-scoped endpoints accept `?season=2025-26` and default to the current season. Keys are issued through RapidAPI.'
components:
  securitySchemes:
    rapidApiKey:
      type: apiKey
      in: header
      name: X-RapidAPI-Key
      description: Your RapidAPI application key
    rapidApiHost:
      type: apiKey
      in: header
      name: X-RapidAPI-Host
      description: Always football-leagues1.p.rapidapi.com
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: A key issued directly, for the origin server
  schemas: {}
paths:
  /competitions:
    get:
      summary: All competitions
      tags:
      - competitions
      description: Every competition this API covers, with the seasons available for each.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                        name:
                          type: string
                        country:
                          type: string
                          nullable: true
                        type:
                          type: string
                          enum:
                          - league
                          - cup
                        logoUrl:
                          type: string
                        currentSeason:
                          type: string
                          nullable: true
                        seasons:
                          type: array
                          items:
                            type: string
                      required:
                      - slug
                      - name
                      - country
                      - type
                      - logoUrl
                      - currentSeason
                      - seasons
                      additionalProperties: false
                  meta:
                    type: object
                    properties:
                      season:
                        type: string
                      page:
                        type: number
                      limit:
                        type: number
                      total:
                        type: number
                    additionalProperties: false
                required:
                - data
                - meta
                additionalProperties: false
  /players/{id}:
    get:
      summary: Player career
      tags:
      - players
      description: A player across every competition and season we hold, with the clubs they appeared for.
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: number
                      slug:
                        type: string
                        nullable: true
                      name:
                        type: string
                      photoUrl:
                        type: string
                      shortName:
                        type: string
                        nullable: true
                      position:
                        type: string
                        nullable: true
                      detailedPosition:
                        type: string
                        nullable: true
                      birthdate:
                        type: string
                        nullable: true
                      age:
                        type: number
                        nullable: true
                      height:
                        type: number
                        nullable: true
                      nationality:
                        type: object
                        properties:
                          id:
                            type: number
                          name:
                            type: string
                        required:
                        - id
                        - name
                        additionalProperties: false
                        nullable: true
                      team:
                        type: object
                        properties:
                          id:
                            type: number
                          slug:
                            type: string
                            nullable: true
                          name:
                            type: string
                          shortName:
                            type: string
                            nullable: true
                          code:
                            type: string
                            nullable: true
                          crestUrl:
                            type: string
                        required:
                        - id
                        - slug
                        - name
                        - shortName
                        - code
                        - crestUrl
                        additionalProperties: false
                        nullable: true
                      shirtNumber:
                        type: number
                        nullable: true
                      career:
                        type: array
                        items:
                          type: object
                          properties:
                            competition:
                              type: string
                            season:
                              type: string
                            team:
                              type: object
                              properties:
                                id:
                                  type: number
                                slug:
                                  type: string
                                  nullable: true
                                name:
                                  type: string
                                shortName:
                                  type: string
                                  nullable: true
                                code:
                                  type: string
                                  nullable: true
                                crestUrl:
                                  type: string
                              required:
                              - id
                              - slug
                              - name
                              - shortName
                              - code
                              - crestUrl
                              additionalProperties: false
                            stats:
                              type: object
                              properties:
                                appearances:
                                  type: number
                                starts:
                                  type: number
                                minutes:
                                  type: number
                                goals:
                                  type: number
                                assists:
                                  type: number
                                penalties:
                                  type: number
                                ownGoals:
                                  type: number
                                yellowCards:
                                  type: number
                                redCards:
                                  type: number
                                avgRating:
                                  type: number
                                  nullable: true
                              required:
                              - appearances
                              - starts
                              - minutes
                              - goals
                              - assists
                              - penalties
                              - ownGoals
                              - yellowCards
                              - redCards
                              - avgRating
                              additionalProperties: false
                          required:
                          - competition
                          - season
                          - team
                          - stats
                          additionalProperties: false
                    required:
                    - id
                    - slug
                    - name
                    - photoUrl
                    - shortName
                    - position
                    - detailedPosition
                    - birthdate
                    - age
                    - height
                    - nationality
                    - team
                    - shirtNumber
                    - career
                    additionalProperties: false
                  meta:
                    type: object
                    properties:
                      season:
                        type: string
                      page:
                        type: number
                      limit:
                        type: number
                      total:
                        type: number
                    additionalProperties: false
                required:
                - data
                - meta
                additionalProperties: false
  /matches/live:
    get:
      summary: Live matches
      tags:
      - matches
      description: Matches in play right now, with the score and the minute. Updated every 30 seconds.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                        competition:
                          type: string
                        season:
                          type: string
                        stage:
                          type: string
                          nullable: true
                        round:
                          type: number
                          nullable: true
                        kickoff:
                          type: string
                          format: date-time
                        status:
                          type: string
                          enum:
                          - scheduled
                          - live
                          - halftime
                          - finished
                          - postponed
                          - cancelled
                        minute:
                          type: number
                          nullable: true
                        homeTeam:
                          type: object
                          properties:
                            id:
                              type: number
                            slug:
                              type: string
                              nullable: true
                            name:
                              type: string
                            shortName:
                              type: string
                              nullable: true
                            code:
                              type: string
                              nullable: true
                            crestUrl:
                              type: string
                          required:
                          - id
                          - slug
                          - name
                          - shortName
                          - code
                          - crestUrl
                          additionalProperties: false
                        awayTeam:
                          type: object
                          properties:
                            id:
                              type: number
                            slug:
                              type: string
                              nullable: true
                            name:
                              type: string
                            shortName:
                              type: string
                              nullable: true
                            code:
                              type: string
                              nullable: true
                            crestUrl:
                              type: string
                          required:
                          - id
                          - slug
                          - name
                          - shortName
                          - code
                          - crestUrl
                          additionalProperties: false
                        score:
                          type: object
                          properties:
                            home:
                              type: number
                              nullable: true
                            away:
                              type: number
                              nullable: true
                          required:
                          - home
                          - away
                          additionalProperties: false
                        venue:
                          type: string
                          nullable: true
                      required:
                      - id
                      - competition
                      - season
                      - stage
                      - round
                      - kickoff
                      - status
                      - minute
                      - homeTeam
                      - awayTeam
                      - score
                      - venue
                      additionalProperties: false
                  meta:
                    type: object
                    properties:
                      season:
                        type: string
                      page:
                        type: number
                      limit:
                        type: number
                      total:
                        type: number
                    additionalProperties: false
                required:
                - data
                - meta
                additionalProperties: false
  /search:
    get:
      summary: Search
      tags:
      - search
      description: Find teams and players by name across every competition.
      parameters:
      - schema:
          type: string
          minLength: 2
          maxLength: 50
        in: query
        name: q
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      teams:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: number
                            slug:
                              type: string
                              nullable: true
                            name:
                              type: string
                            shortName:
                              type: string
                              nullable: true
                            code:
                              type: string
                              nullable: true
                            crestUrl:
                              type: string
                          required:
                          - id
                          - slug
                          - name
                          - shortName
                          - code
                          - crestUrl
                          additionalProperties: false
                      players:
                        type: array
                        items:
                          type: object
