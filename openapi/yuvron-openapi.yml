                      - score
                      - venue
                      additionalProperties: false
                  meta:
                    type: object
                    properties:
                      season:
                        type: string
                      page:
                        type: number
                      limit:
                        type: number
                      total:
                        type: number
                    additionalProperties: false
                required:
