name: Football API
aid: yuvron
description: 'Football API, run by the owner of yuvron.online, is a read-only REST API for 11 European football
  competitions (Premier League, LaLiga, Serie A, Bundesliga, Ligue 1, Eredivisie, Primeira Liga, EFL Championship
  and the three UEFA club competitions): standings, fixtures, results, live scores updated every 30 seconds, lineups,
  match events, squads and per-player statistics for the current and previous season. Keys are issued through RapidAPI
  (a free Basic plan of 500 requests a month, paid plans from $5.00/mo), and the site publishes an OpenAPI 3.0 contract,
  an APIs.json index and llms.txt at football-api.yuvron.online. Not the RapidAPI football98 listing catalogued
  as `football`.'
